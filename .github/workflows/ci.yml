name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: uv run ruff check .
      - run: uv run ruff check api scripts --select S
      - run: uv run mypy
      - run: uv run coverage run --source=api/admission_engine/engine -m pytest
      - run: uv run coverage report --fail-under=90
      - run: DATABASE_URL=postgresql+psycopg://evalio:evalio@127.0.0.1:5432/evalio uv run alembic upgrade head --sql > /dev/null
      - run: npm audit --audit-level=low
      - run: uvx pip-audit
      - run: npm run build
